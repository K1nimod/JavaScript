<!DOCTYPE html>
<html lang="hu" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoVault - Saját Garázs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #e6edf3; }
        .fo-doboz {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 25px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        h1 { text-align: center; color: #58a6ff; margin-bottom: 24px; }
        .felso-sor {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background-color: #0d1117;
            padding: 12px 18px;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .urlap {
            background-color: #0d1117;
            padding: 18px;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin-bottom: 20px;
            align-items: center;
        }
        .szuro {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            background-color: #0d1117;
            padding: 12px 18px;
            border-radius: 8px;
            border-left: 4px solid #58a6ff;
            margin-bottom: 24px;
        }
        .szuro select { width: 180px; }
        .card {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-top: 3px solid #58a6ff;
            height: 100%;
        }
        .card-img-top { height: 190px; object-fit: cover; }
        .adat { color: #8b949e; font-size: 14px; margin-bottom: 4px; }
        .ar { color: #58a6ff; font-size: 18px; font-weight: bold; margin-bottom: 12px; }
        .gombok { display: flex; gap: 8px; margin-top: auto; }
        .gombok button { flex: 1; }
    </style>
</head>
<body>
    <div class="container fo-doboz">
        <h1>SAJÁT GARÁZS</h1>

        <div class="felso-sor">
            <span id="statusz"></span>
            <div>
                <a href="/" class="btn btn-primary btn-sm">Publikus Feed</a>
                <button class="btn btn-outline-secondary btn-sm" onclick="kilep()">Kilépés</button>
            </div>
        </div>

        <form id="form" class="row g-2 urlap">
            <div class="col-12 col-sm-6 col-lg">
                <input type="text" id="brand" class="form-control" placeholder="Márka (pl. BMW)">
            </div>
            <div class="col-12 col-sm-6 col-lg">
                <input type="text" id="model" class="form-control" placeholder="Modell">
            </div>
            <div class="col-6 col-lg">
                <input type="number" id="year" class="form-control" placeholder="Évjárat">
            </div>
            <div class="col-6 col-lg">
                <input type="number" id="price" class="form-control" placeholder="Ár (Ft)">
            </div>
            <div class="col-12 col-lg">
                <input type="url" id="image_url" class="form-control" placeholder="Kép URL">
            </div>
            <div class="col-auto">
                <div class="form-check">
                    <input type="checkbox" id="is_public" class="form-check-input" checked>
                    <label for="is_public" class="form-check-label">Publikus</label>
                </div>
            </div>
            <div class="col-12 col-lg-auto">
                <button type="button" class="btn btn-success w-100" onclick="ment()">Mentés</button>
            </div>
        </form>

        <div class="szuro">
            <label for="szuro">Márka:</label>
            <select id="szuro" class="form-select" onchange="megjelenit()">
                <option value="mind">Összes</option>
            </select>
        </div>

        <div id="lista" class="row g-4"></div>
    </div>

    <script>
        let cars = [];
        let editId = null;
        const user = JSON.parse(localStorage.getItem('user'));

        if (!user) {
            window.location.href = '/belepes';
        }

        document.getElementById('statusz').innerText = 'Belépve: ' + user.username;

        function kilep() {
            localStorage.removeItem('user');
            window.location.href = '/';
        }

        function betolt() {
            fetch('/cars/user/' + user.id)
                .then(valasz => valasz.json())
                .then(adatok => {
                    cars = adatok;
                    szuroFrissit();
                    megjelenit();
                });
        }

        function szuroFrissit() {
            const szuro = document.getElementById('szuro');
            szuro.innerHTML = '<option value="mind">Összes</option>';
            const markak = [];

            for (let i = 0; i < cars.length; i++) {
                if (!markak.includes(cars[i].brand)) {
                    markak.push(cars[i].brand);
                    szuro.innerHTML += `<option value="${cars[i].brand}">${cars[i].brand}</option>`;
                }
            }
        }

        function megjelenit() {
            const lista = document.getElementById('lista');
            const kivalasztott = document.getElementById('szuro').value;
            lista.innerHTML = '';

            for (let i = 0; i < cars.length; i++) {
                const c = cars[i];
                if (kivalasztott === 'mind' || c.brand === kivalasztott) {
                    let allapot = 'Privát';
                    if (c.is_public === 1) {
                        allapot = 'Publikus';
                    }
                    lista.innerHTML += `
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="card">
                                <img src="${c.image_url}" class="card-img-top" alt="${c.model}">
                                <div class="card-body d-flex flex-column">
                                    <h5>${c.brand} ${c.model}</h5>
                                    <p class="adat">Évjárat: ${c.year}</p>
                                    <p class="adat">Állapot: ${allapot}</p>
                                    <p class="ar">${c.price.toLocaleString()} Ft</p>
                                    <div class="gombok">
                                        <button class="btn btn-primary btn-sm" onclick="szerkeszt(${c.id})">Módosítás</button>
                                        <button class="btn btn-danger btn-sm" onclick="torol(${c.id})">Törlés</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        }

        function szerkeszt(id) {
            for (let i = 0; i < cars.length; i++) {
                if (cars[i].id === id) {
                    editId = id;
                    document.getElementById('brand').value = cars[i].brand;
                    document.getElementById('model').value = cars[i].model;
                    document.getElementById('year').value = cars[i].year;
                    document.getElementById('price').value = cars[i].price;
                    document.getElementById('image_url').value = cars[i].image_url;
                    document.getElementById('is_public').checked = cars[i].is_public === 1;
                }
            }
        }

        function ment() {
            const adat = {
                user_id: user.id,
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                year: parseInt(document.getElementById('year').value),
                price: parseInt(document.getElementById('price').value),
                image_url: document.getElementById('image_url').value,
                is_public: document.getElementById('is_public').checked
            };
            if (!adat.brand || !adat.model || !adat.year || !adat.price || !adat.image_url) {
                alert("Minden mezőt tölts ki!");
                return;
            }
            let url = '/cars';
            let method = 'POST';
            if (editId) {
                url = '/cars/' + editId;
                method = 'PUT';
            }
            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(adat)
            })
            .then(valasz => valasz.json())
            .then(eredmeny => {
                if (eredmeny.error) {
                    alert(eredmeny.error);
                } else {
                    document.getElementById('form').reset();
                    editId = null;
                    betolt();
                }
            });
        }

        function torol(id) {
            fetch('/cars/' + id, {
                method: 'DELETE',
                headers: { 'user-id': user.id }
            })
            .then(() => {
                betolt();
            });
        }

        betolt();
    </script>
</body>
</html>
