<!DOCTYPE html>
<html lang="hu" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoVault - Belépés</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #e6edf3; }
        .belepes-doboz {
            max-width: 380px;
            margin: 80px auto;
            padding: 25px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        h3 { text-align: center; color: #58a6ff; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="belepes-doboz">
            <h3>BELÉPÉS / REGISZTRÁCIÓ</h3>
            <input type="text" id="username" class="form-control" placeholder="Felhasználónév">
            <input type="password" id="password" class="form-control" placeholder="Jelszó">
            <button class="btn btn-primary" onclick="belep('/login')">Belépés</button>
            <button class="btn btn-success" onclick="belep('/register')">Regisztráció</button>
            <a href="/" class="btn btn-outline-secondary">Vissza a Publikus Feedre</a>
        </div>
    </div>

    <script>
        function belep(url) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(valasz => valasz.json())
            .then(adat => {
                if (adat.error) {
                    alert(adat.error);
                } else {
                    localStorage.setItem('user', JSON.stringify(adat));
                    window.location.href = '/garazs';
                }
            });
        }
    </script>
</body>
</html>
