<!DOCTYPE html>
<html lang="hu" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoVault - Publikus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #e6edf3; }
        .fo-doboz {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 25px;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        h1 { text-align: center; color: #58a6ff; margin-bottom: 24px; }
        .szuro {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background-color: #0d1117;
            padding: 12px 18px;
            border-radius: 8px;
            border-left: 4px solid #58a6ff;
            margin-bottom: 24px;
        }
        .szuro-valaszto { display: flex; align-items: center; gap: 8px; }
        .szuro-valaszto select { width: 180px; }
        .card {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-top: 3px solid #58a6ff;
            height: 100%;
        }
        .card-img-top { height: 190px; object-fit: cover; }
        .adat { color: #8b949e; font-size: 14px; margin-bottom: 4px; }
        .ar { color: #58a6ff; font-size: 18px; font-weight: bold; margin-top: auto; margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="container fo-doboz">
        <h1>AUTOVAULT - PUBLIKUS FEED</h1>

        <div class="szuro">
            <a href="/garazs" class="btn btn-primary">Saját Garázsom / Belépés</a>
            <div class="szuro-valaszto">
                <label for="szuro">Márka:</label>
                <select id="szuro" class="form-select" onchange="megjelenit()">
                    <option value="mind">Összes</option>
                </select>
            </div>
        </div>

        <div id="lista" class="row g-4"></div>
    </div>

    <script>
        let cars = [];

        function betolt() {
            fetch('/cars/public')
                .then(valasz => valasz.json())
                .then(adatok => {
                    cars = adatok;
                    szuroFrissit();
                    megjelenit();
                });
        }

        function szuroFrissit() {
            const szuro = document.getElementById('szuro');
            szuro.innerHTML = '<option value="mind">Összes</option>';
            const markak = [];

            for (let i = 0; i < cars.length; i++) {
                if (!markak.includes(cars[i].brand)) {
                    markak.push(cars[i].brand);
                    szuro.innerHTML += `<option value="${cars[i].brand}">${cars[i].brand}</option>`;
                }
            }
        }

        function megjelenit() {
            const lista = document.getElementById('lista');
            const kivalasztott = document.getElementById('szuro').value;
            lista.innerHTML = '';

            for (let i = 0; i < cars.length; i++) {
                const c = cars[i];
                if (kivalasztott === 'mind' || c.brand === kivalasztott) {
                    lista.innerHTML += `
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="card">
                                <img src="${c.image_url}" class="card-img-top" alt="${c.model}">
                                <div class="card-body d-flex flex-column">
                                    <h5>${c.brand} ${c.model}</h5>
                                    <p class="adat">Évjárat: ${c.year}</p>
                                    <p class="adat">Tulajdonos: ${c.owner}</p>
                                    <p class="ar">${c.price.toLocaleString()} Ft</p>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        }

        betolt();
    </script>
</body>
</html>
